<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5. ročník - Materiály pre žiakov</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1a1f1c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 40px 36px;
      max-width: 550px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }
    .file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #f0f4f1;
      border-radius: 10px;
      text-decoration: none;
      color: #1a1f1c;
      font-weight: 500;
      transition: all 0.2s;
      border: 2px solid transparent;
      text-align: left;
    }
    .file-card:hover {
      background: #2F5D3F;
      color: white;
    }
    .file-icon {
      font-size: 1.2rem;
      margin-right: 12px;
    }
    .file-name {
      flex: 1;
      word-break: break-word;
    }
    .file-size {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-left: 10px;
      white-space: nowrap;
    }
    .logout {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: #eee;
      color: #555;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .logout:hover {
      background: #ddd;
      color: #1a1f1c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>5. ročník</h1>
    <p class="subtitle">Materiály na stiahnutie</p>
  
    <div class="file-list">
      <!-- 
        Do data-file napíš presný názov súboru v danom priečinku.
        Kód sám zistí jeho aktuálnu veľkosť a zapíše ju namiesto textu "Načítavam..."
      -->
      <a href="1.Software_Hardware_Subory.pptx" class="file-card" download data-file="1.Software_Hardware_Subory.pptx">
        <span class="file-icon">📊</span>
        <span class="file-name">Software_Hardware_Subory</span>
        <span class="file-size">Načítavam...</span>
      </a>

      <a href="2.Subor_a_priecinok.pptx" class="file-card" download data-file="2.Subor_a_priecinok.pptx">
        <span class="file-icon">📊</span>
        <span class="file-name">Subor_a_priecinok</span>
        <span class="file-size">Načítavam...</span>
      </a>
    
     <a href="3.Software_Hardware.pptx" class="file-card" download data-file="3.Software_Hardware.pptx">
        <span class="file-icon">📊</span>
        <span class="file-name">Software_Hardware</span>
        <span class="file-size">Načítavam...</span>
      </a>

      <a href="4.Softver_a_hardver_siet_a_internet.pptx" class="file-card" download data-file="4.Softver_a_hardver_siet_a_internet.pptx">
        <span class="file-icon">📊</span>
        <span class="file-name">Softver_a_hardver_siet_a_internet</span>
        <span class="file-size">Načítavam...</span>
      </a>
      
      <a href="5.Bezpecne_hesla_pre_deti.pptx" class="file-card" download data-file="5.Bezpecne_hesla_pre_deti.pptx">
        <span class="file-icon">📊</span>
        <span class="file-name">Bezpecne_hesla_pre_deti</span>
        <span class="file-size">Načítavam...</span>
      </a>
      
      <a href="5.Ochrana_pred_virusmi_a_spehovanim.pptx" class="file-card" download data-file="5.Ochrana_pred_virusmi_a_spehovanim.pptx">
        <span class="file-icon">📊</span>
        <span class="file-name">Ochrana_pred_virusmi_a_spehovanim</span>
        <span class="file-size">Načítavam...</span>
      </a>
    </div>

    <button class="logout" onclick="logout()">Odhlásiť sa / Späť na úvod</button>
  </div>

  <script>
    // Kontrola, či bol prístup do 5. ročníka overený
    if (sessionStorage.getItem("mainLoggedIn") !== "true" || sessionStorage.getItem("gradeLoggedIn_5") !== "true") {
      window.location.href = "../"; // Presmerovanie na hlavnú stránku, ak nie je prihlásený
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "../"; // Presmerovanie na hlavnú úvodnú stránku
    }
  </script>
</body>
</html>
