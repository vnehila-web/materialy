<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiály pre žiakov</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1a1f1c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .password-group {
      position: relative;
      width: 100%;
      margin-bottom: 14px;
    }
    .password-group input {
      width: 100%;
      padding: 14px 45px 14px 16px;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    .password-group input:focus {
      border-color: #2F5D3F;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
      color: #666;
      width: auto;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: #2F5D3F;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #264C32;
    }
    .error {
      color: #c0392b;
      margin-top: 12px;
      font-size: 0.9rem;
      display: none;
    }
    #content, #grade-modal {
      display: none;
    }
    .grades {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }
    .grade-btn {
      display: block;
      width: 100%;
      padding: 16px;
      background: #f0f4f1;
      color: #1a1f1c;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.2s;
      border: 2px solid transparent;
      cursor: pointer;
      text-align: center;
    }
    .grade-btn:hover {
      background: #2F5D3F;
      color: white;
    }
    .logout {
      margin-top: 24px;
      background: #eee;
      color: #555;
      font-size: 0.9rem;
    }
    .logout:hover {
      background: #ddd;
      color: #1a1f1c;
    }
    .btn-secondary {
      background: #eee;
      color: #555;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #ddd;
      color: #1a1f1c;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Prvá obrazovka: Zadanie hlavného hesla -->
    <div id="login-box">
      <h1>Materiály pre žiakov INF</h1>
      <p class="subtitle">Zadaj heslo pre vstup</p>
      
      <div class="password-group">
        <input type="password" id="password" placeholder="Heslo" autofocus>
        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
      </div>

      <button onclick="checkMainPassword()">Vstúpiť</button>
      <p class="error" id="error">Nesprávne heslo</p>
    </div>

    <!-- Druhá obrazovka: Výber ročníkov -->
    <div id="content">
      <h1>Vyber ročník</h1>
      <p class="subtitle">Materiály na stiahnutie</p>
      <div class="grades">
        <button class="grade-btn" onclick="openGrade('5')">5. ročník</button>
        <button class="grade-btn" onclick="openGrade('6')">6. ročník</button>
        <button class="grade-btn" onclick="openGrade('7')">7. ročník</button>
        <button class="grade-btn" onclick="openGrade('8')">8. ročník</button>
        <button class="grade-btn" onclick="openGrade('9')">9. ročník</button>
      </div>
      <button class="logout grade-btn" onclick="logout()">Odhlásiť sa</button>
    </div>

    <!-- Tretia obrazovka: Zadanie hesla ročníka -->
    <div id="grade-modal">
      <h1 id="modal-title">Zadaj heslo</h1>
      <p class="subtitle">Vstup do materiálov</p>
      
      <div class="password-group">
        <input type="password" id="grade-password" placeholder="Heslo pre ročník">
        <button type="button" class="toggle-password" onclick="togglePassword('grade-password', this)">👁️</button>
      </div>

      <button onclick="confirmGradePassword()">Potvrdiť</button>
      <button class="btn-secondary grade-btn" onclick="closeGradeModal()">Zrušiť</button>
      <p class="error" id="grade-error">Nesprávne heslo ročníka</p>
    </div>
  </div>

  <script>
    // ==========================================
    // ZAHASOVANÉ HESLÁ (SHA-256)
    // 
    // Aktuálne nastavené heslá v tomto kóde:
    // Hlavné heslo: "skola2026"
    // Heslo pre 5. ročník: "heslo5"
    // Heslo pre 6. ročník: "heslo6"
    // Heslo pre 7. ročník: "heslo7"
    // Heslo pre 8. ročník: "heslo8"
    // Heslo pre 9. ročník: "heslo9"
    // ==========================================
    const CORRECT_PASSWORD_HASH = "8227b680780281b3793f0b2f5d601b315414ab2612745cf548c0847f96ea5b91";

    const GRADE_PASSWORD_HASHES = {
      "5": "3fa0556276722ae3923d6a26df89d81647e30d1aa17f8a7ad148446c7ccb8ff3",
      "6": "c882a7f5ea4e840a233636f332ee4e9f5e3e2304918e9d9e29a59e99a22f311c",
      "7": "098dcf6697a229a531e21b0337852a36d9d431057e0344d5c92c9066bf917f84",
      "8": "a79cb79e73111f924df3216d7fb13768e1c66b5774a38e888631bfa283d5a497",
      "9": "86bc33a763acffc8bc05bf8b8493158097b3992b45cf5777df4c9441f99c8fc4"
    };
    // ==========================================

    let selectedGrade = null;

    // Pomocná funkcia na vytvorenie SHA-256 hash z textového reťazca
    async function hashString(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "👁️";
      }
    }

    async function checkMainPassword() {
      const input = document.getElementById("password").value;
      const inputHash = await hashString(input);

      if (inputHash === CORRECT_PASSWORD_HASH) {
        sessionStorage.setItem("mainLoggedIn", "true");
        showContent();
      } else {
        document.getElementById("error").style.display = "block";
        document.getElementById("password").value = "";
      }
    }

    function showContent() {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("grade-modal").style.display = "none";
      document.getElementById("content").style.display = "block";
    }

    function openGrade(rocnik) {
      const sessionKey = `gradeLoggedIn_${rocnik}`;

      if (sessionStorage.getItem(sessionKey) === "true") {
        window.location.href = `${rocnik}rocnik/`;
        return;
      }

      selectedGrade = rocnik;
      document.getElementById("modal-title").textContent = `${rocnik}. ročník`;
      document.getElementById("grade-password").value = "";
      document.getElementById("grade-error").style.display = "none";
      
      document.getElementById("content").style.display = "none";
      document.getElementById("grade-modal").style.display = "block";
      document.getElementById("grade-password").focus();
    }

    async function confirmGradePassword() {
      const input = document.getElementById("grade-password").value;
      const inputHash = await hashString(input);
      const correctHash = GRADE_PASSWORD_HASHES[selectedGrade];

      if (inputHash === correctHash) {
        sessionStorage.setItem(`gradeLoggedIn_${selectedGrade}`, "true");
        window.location.href = `${selectedGrade}rocnik/`;
      } else {
        document.getElementById("grade-error").style.display = "block";
        document.getElementById("grade-password").value = "";
      }
    }

    function closeGradeModal() {
      document.getElementById("grade-modal").style.display = "none";
      document.getElementById("content").style.display = "block";
    }

    function logout() {
      sessionStorage.clear();
      location.reload();
    }

    if (sessionStorage.getItem("mainLoggedIn") === "true") {
      showContent();
    }

    document.getElementById("password").addEventListener("keyup", function(e) {
      if (e.key === "Enter") checkMainPassword();
    });

    document.getElementById("grade-password").addEventListener("keyup", function(e) {
      if (e.key === "Enter") confirmGradePassword();
    });
  </script>

</body>
</html>
