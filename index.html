<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiály na informatiku</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1a1f1c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 50px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #1a1f1c;
    }
    .subtitle {
      color: #666;
      margin-bottom: 36px;
      font-size: 1.05rem;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #2F5D3F;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #264C32;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Materiály na informatiku pre žiakov ZŠ</h1>
    <p class="subtitle">Vstúp do portálu a vyber si svoj ročník s učebnými materiálmi.</p>
    
    <a href="rocniky.html" class="btn">Vstúpiť do portálu</a>
  </div>

</body>
</html>
