<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materiály pre žiakov</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1a1f1c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 40px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    #login-box input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 10px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #login-box input:focus {
      border-color: #2F5D3F;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      background: #2F5D3F;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #264C32;
    }
    .error {
      color: #c0392b;
      margin-top: 12px;
      font-size: 0.9rem;
      display: none;
    }
    #content {
      display: none;
    }
    .grades {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }
    .grade-btn {
      display: block;
      padding: 16px;
      background: #f0f4f1;
      color: #1a1f1c;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .grade-btn:hover {
      background: #2F5D3F;
      color: white;
    }
    .logout {
      margin-top: 24px;
      background: #eee;
      color: #555;
      font-size: 0.9rem;
    }
    .logout:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login -->
    <div id="login-box">
      <h1>Materiály pre žiakov</h1>
      <p class="subtitle">Zadaj heslo pre vstup</p>
      <input type="password" id="password" placeholder="Heslo" autofocus>
      <button onclick="checkPassword()">Vstúpiť</button>
      <p class="error" id="error">Nesprávne heslo</p>
    </div>

    <!-- Content after login -->
    <div id="content">
      <h1>Vyber ročník</h1>
      <p class="subtitle">Materiály na stiahnutie</p>
      <div class="grades">
        <a class="grade-btn" href="5rocnik/">5. ročník</a>
        <a class="grade-btn" href="6rocnik/">6. ročník</a>
        <a class="grade-btn" href="7rocnik/">7. ročník</a>
        <a class="grade-btn" href="8rocnik/">8. ročník</a>
        <a class="grade-btn" href="9rocnik/">9. ročník</a>
      </div>
      <button class="logout" onclick="logout()">Odhlásiť sa</button>
    </div>
  </div>

  <script>
    // ======================
    // TU SI NASTAV HESLO
    const CORRECT_PASSWORD = "skola2026";
    // ======================

    function checkPassword() {
      const input = document.getElementById("password").value;
      if (input === CORRECT_PASSWORD) {
        sessionStorage.setItem("loggedIn", "true");
        showContent();
      } else {
        document.getElementById("error").style.display = "block";
        document.getElementById("password").value = "";
      }
    }

    function showContent() {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("content").style.display = "block";
    }

    function logout() {
      sessionStorage.removeItem("loggedIn");
      location.reload();
    }

    // Ak už je prihlásený
    if (sessionStorage.getItem("loggedIn") === "true") {
      showContent();
    }

    // Enter na potvrdenie
    document.getElementById("password").addEventListener("keyup", function(e) {
      if (e.key === "Enter") checkPassword();
    });
  </script>
</body>
</html>
